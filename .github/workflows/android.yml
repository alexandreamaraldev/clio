name: android

on:
  push:
    branches: [main, clio-android]
    paths:
      - "apps/clio-android/**"
      - "crates/**"
      - "assets/**"
      - "Cargo.*"
      - ".github/workflows/android.yml"
  pull_request:
    paths:
      - "apps/clio-android/**"
      - "crates/**"
      - "assets/**"
      - "Cargo.*"
      - ".github/workflows/android.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

env:
  NDK_VERSION: "27.2.12479018"
  RUST_TOOLCHAIN: "1.99.1"

jobs:
  apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    defaults:
      run:
        working-directory: apps/clio-android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }

      - name: Cache NDK
        id: ndk-cache
        uses: actions/cache@v4
        with:
          path: /usr/local/lib/android/sdk/ndk/${{ env.NDK_VERSION }}
          key: ndk-${{ env.NDK_VERSION }}
      # ubuntu-24.04 ships the Android SDK at $ANDROID_HOME; add the pinned NDK/platform.
      - name: Install NDK + platform
        run: |
          sdkm="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          pkgs=("platforms;android-35" "build-tools;35.0.0")
          if [ "${{ steps.ndk-cache.outputs.cache-hit }}" != true ]; then pkgs+=("ndk;$NDK_VERSION"); fi
          yes | "$sdkm" "${pkgs[@]}" > /dev/null

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          targets: aarch64-linux-android,x86_64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          key: android-${{ env.NDK_VERSION }}
          cache-targets: true
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-ndk@4.1.2

      - name: Engine unit tests (ffi-mobile)
        working-directory: .
        run: cargo test -p filmcraft-ffi-mobile
      - name: Build Rust engine + Kotlin bindings
        run: ANDROID_NDK_HOME="$ANDROID_HOME/ndk/$NDK_VERSION" ./build-rust.sh
      - name: Assert native libraries
        run: |
          for abi in arm64-v8a x86_64; do test -s "app/src/main/jniLibs/$abi/libclio_ffi.so"; done
          test -s app/src/main/java/uniffi/clio_ffi/clio_ffi.kt

      - uses: gradle/actions/setup-gradle@v4
      - name: Screenshot tests (Paparazzi)
        run: ./gradlew verifyPaparazziDebug
      - name: Assemble debug APK
        run: ./gradlew assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: clio-debug-apk
          path: apps/clio-android/app/build/outputs/apk/debug/*.apk
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: paparazzi-failures
          path: apps/clio-android/app/build/paparazzi/failures
          retention-days: 7
