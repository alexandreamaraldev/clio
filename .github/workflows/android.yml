name: android

on:
  push:
    branches: [main, clio-android]
    paths:
      - "apps/clio-android/**"
      - "crates/**"
      - "assets/**"
      - "Cargo.*"
      - ".github/workflows/android.yml"
  pull_request:
    paths:
      - "apps/clio-android/**"
      - "crates/**"
      - "assets/**"
      - "Cargo.*"
      - ".github/workflows/android.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

env:
  NDK_VERSION: "27.2.12479018"
  RUST_TOOLCHAIN: "1.99.1"

jobs:
  apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    defaults:
      run:
        working-directory: apps/clio-android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }

      - name: Cache NDK
        id: ndk-cache
        uses: actions/cache@v4
        with:
          path: /usr/local/lib/android/sdk/ndk/${{ env.NDK_VERSION }}
          key: ndk-${{ env.NDK_VERSION }}
      # ubuntu-24.04 ships the Android SDK at $ANDROID_HOME; add the pinned NDK/platform.
      - name: Install NDK + platform
        run: |
          sdkm="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          pkgs=("platforms;android-35" "build-tools;35.0.0")
          if [ "${{ steps.ndk-cache.outputs.cache-hit }}" != true ]; then pkgs+=("ndk;$NDK_VERSION"); fi
          yes | "$sdkm" "${pkgs[@]}" > /dev/null

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          targets: aarch64-linux-android,x86_64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          key: android-${{ env.NDK_VERSION }}
          cache-targets: true
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-ndk@4.1.2

      - name: Engine unit tests (ffi-mobile)
        working-directory: .
        run: cargo test -p filmcraft-ffi-mobile
      - name: Build Rust engine + Kotlin bindings
        run: ANDROID_NDK_HOME="$ANDROID_HOME/ndk/$NDK_VERSION" ./build-rust.sh
      - name: Assert native libraries
        run: |
          for abi in arm64-v8a x86_64; do test -s "app/src/main/jniLibs/$abi/libclio_ffi.so"; done
          test -s app/src/main/java/uniffi/clio_ffi/clio_ffi.kt

      - uses: gradle/actions/setup-gradle@v4
      - name: Screenshot tests (Paparazzi)
        run: ./gradlew verifyPaparazziDebug
      - name: Assemble debug APK (+ instrumented tests)
        run: ./gradlew assembleDebug assembleDebugAndroidTest

      - uses: actions/upload-artifact@v4
        with:
          name: clio-debug-apk
          path: apps/clio-android/app/build/outputs/apk/debug/*.apk
          retention-days: 14
      - uses: actions/upload-artifact@v4
        with:
          name: clio-androidtest-apk
          path: apps/clio-android/app/build/outputs/apk/androidTest/debug/*.apk
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: paparazzi-failures
          path: apps/clio-android/app/build/paparazzi/failures
          retention-days: 7

  # End-to-end tests on an API 34 x86_64 emulator (KVM on GitHub runners).
  device-qa:
    needs: apk
    runs-on: ubuntu-latest
    timeout-minutes: 75
    concurrency:
      group: device-qa-${{ github.ref }}
      cancel-in-progress: true
    env:
      API: 34
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: clio-debug-apk, path: apks/app }
      - uses: actions/download-artifact@v4
        with: { name: clio-androidtest-apk, path: apks/test }
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Generate test video (6 s, 1280x720, 30 fps, AAC)
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg > /dev/null
          ffmpeg -loglevel error -f lavfi -i testsrc2=size=1280x720:rate=30:duration=6 -f lavfi -i sine=frequency=440:sample_rate=44100:duration=6 \
            -c:v libx264 -pix_fmt yuv420p -g 30 -c:a aac -b:a 128k -shortest -movflags +faststart clio-test.mp4
          ffprobe -v error -show_entries format=duration:stream=codec_type,width,height -of compact clio-test.mp4
      - name: AVD cache
        uses: actions/cache@v4
        id: avd-cache
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-${{ env.API }}-x86_64-google_apis-v1
      - name: Create AVD snapshot
        if: steps.avd-cache.outputs.cache-hit != 'true'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ env.API }}
          arch: x86_64
          target: google_apis
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: echo "AVD snapshot created"
      - name: Run end-to-end tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ env.API }}
          arch: x86_64
          target: google_apis
          force-avd-creation: false
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: apps/clio-android/qa/run-device-qa.sh apks/app/app-debug.apk apks/test/app-debug-androidTest.apk clio-test.mp4 qa-out
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: device-qa-screenshots
          path: qa-out/screens
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: device-qa-screenrecord
          path: qa-out/screenrecord
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: device-qa-logs
          path: |
            qa-out/*.txt
          retention-days: 14
